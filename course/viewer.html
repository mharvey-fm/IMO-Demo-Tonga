<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document viewer | Tonga Workshop Portal</title>
    <meta name="description" content="Course PDFs — in-water inspections and in-water cleaning.">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/portal.css">
    <link rel="stylesheet" href="course.css">
</head>
<body class="course-page viewer-page">

    <div id="portal-chrome" data-active="course" data-base="../"></div>

    <div class="viewer-toolbar">
        <div class="container">
            <div class="viewer-titles">
                <div class="crumb" id="v-crumb">Course materials</div>
                <h1 id="v-title">Loading…</h1>
            </div>
            <div class="viewer-controls" id="v-controls">
                <a class="v-btn" id="v-back" href="index.html">← Library</a>
                <button type="button" class="v-btn" id="v-prev" disabled aria-label="Previous page">‹</button>
                <span class="page-ind" id="v-page">—</span>
                <button type="button" class="v-btn" id="v-next" disabled aria-label="Next page">›</button>
                <button type="button" class="v-btn" id="v-minus" aria-label="Zoom out">−</button>
                <button type="button" class="v-btn" id="v-plus" aria-label="Zoom in">+</button>
                <a class="v-btn primary" id="v-open" href="#" target="_blank" rel="noopener">Open PDF</a>
            </div>
        </div>
    </div>

    <main class="course-main viewer-stage">
        <div id="v-status" class="viewer-status">
            <p>Opening the document…</p>
        </div>
        <div class="viewer-canvas-wrap" id="v-wrap" hidden>
            <div class="pdf-pages" id="v-pages"></div>
        </div>
    </main>

    <footer class="course-foot">
        <div class="container">Franmarine · MarineStream · Tonga National Technology Demonstration &amp; Training Workshop</div>
    </footer>

    <script src="../assets/portal-nav.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="materials.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
